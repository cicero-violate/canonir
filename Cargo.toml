async-trait = "0.1"
chrono = "0.4"
csv = "1"
crossbeam-channel = "0.5"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
notify = "6"
once_cell = "1"
prettyplease = "0.2"
proc-macro2 = "1"
rand = "0.8"
rayon = "1.10"
regex = "1"
rkyv = "0.7"
schemars = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
syn = "2"
tempfile = "3"
thiserror = "1"
tokio = "1"
tokio-tungstenite = "0.20"
toml = "0.8"
walkdir = "2.5"
z3 = { version = "0.12", default-features = false }
