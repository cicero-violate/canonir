[workspace]
members = [
  # "algorithms",
  "algorithms",
  "canon-capture",
  # "canon-mutation",
  # "orchestration",
  # "canon_telemetry",
  "canonir",
  # "canon-analyzer", 
  # "canon-projection",
  # "canon-agent",
  "canon-agent-v2",
  "canon-supervisor",
  "canon-utils/canon-editor",
  "canon-utils/canon-query",
  "canon-utils/event-consumers",
  "canon-utils/event-runtime",
  "canon-utils/event-log",
  "canon-utils/canon-graph",
  "canon-utils/canon-analysis",
  "canon-utils/canon-types",
  "canon-utils/capability",
  "canon-utils/capabilities-runtime",
  "canon-utils/tlog-replay",
  "canon-utils/tlog-writer",
]
exclude = [
  "test_projects",
]
resolver = "2"

[workspace.dependencies]
