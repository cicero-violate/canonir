[package]
name = "canon-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
csv.workspace = true
canon_types = { path = "../canon-types" }
prettyplease.workspace = true
proc-macro2.workspace = true
syn = { workspace = true, features = ["full", "visit-mut", "visit"] }
walkdir.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
canon = { path = "../../canonir" }
canon_event_log = { package = "canon-event-log", path = "../event-log" }
canon_capability = { package = "canon-capability", path = "../capability" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "editor_capability_smoke_test"
path = "src/bin/capability_smoke_test.rs"
