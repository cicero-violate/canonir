[package]
name = "canon-tools-editor"
version = "0.1.0"
edition = "2021"
autotests = false
autobins = false

[lib]
path = "src/lib.rs"
name = "canon_editor"

[dependencies]
anyhow.workspace = true
csv.workspace = true
canon_types = { path = "../canon-types" }
prettyplease.workspace = true
proc-macro2.workspace = true
syn = { workspace = true, features = ["full", "visit-mut", "visit"] }
walkdir.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
canon-ir = { path = "../../canon-ir" }
canon_event = { package = "canon-runtime-events", path = "../canon-runtime-events" }
canon-meta = { path = "../canon-meta" }
canon-exec = { path = "../canon-exec" }
canon-proc-macros = { path = "../canon-proc-macros" }
canon_analysis = { package = "canon-tools-analysis", path = "../canon-tools-analysis" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "editor_capability_smoke_test"
path = "src/bin/capability_smoke_test.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "rename"
path = "src/bin/rename.rs"
test = false
bench = false
doctest = false
