[package]
name = "canon-runtime"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
# name = "canon_kernel"
name = "canon_runtime"

[[bin]]
name = "canon-runtime"
path = "src/bin/event_runtime.rs"
test = false

[[bin]]
name = "capability_smoke_test"
