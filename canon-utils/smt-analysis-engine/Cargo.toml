[package]
name = "analysis-engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["cuda"]
cuda = ["algorithms/cuda"]

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rayon.workspace = true
algorithms = { path = "../../algorithms" }
canon_types = { path = "../canon-types" }
z3.workspace = true
sha2.workspace = true
hex.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "analysis-engine"
path = "src/main.rs"
