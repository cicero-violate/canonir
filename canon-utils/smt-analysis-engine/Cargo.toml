[package]
name = "analysis-engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["cuda"]
cuda = ["algorithms/cuda"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
algorithms = { path = "../../algorithms" }
canon_types = { path = "../canon-types" }
z3 = { version = "0.12", default-features = false }
sha2 = "0.10"
hex = "0.4"

[lib]
path = "src/lib.rs"

[[bin]]
name = "analysis-engine"
path = "src/main.rs"
