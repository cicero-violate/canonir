[package]
name = "canon-llm-runtime"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
name = "canon_llm"

[dependencies]
anyhow = "1.0"
canon-meta = { path = "../canon-meta" }
canon_event = { package = "canon-runtime-events", path = "../canon-runtime-events" }

# async runtime
tokio = { version = "1", features = ["full"] }

# async utils
futures-util = "0.3"

# websocket
tokio-tungstenite = "0.21"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# config parsing
toml = "0.8"

# global state
once_cell = "1.19"

# optional but used in your code
hashbrown = "0.14"
