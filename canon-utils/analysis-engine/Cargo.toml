[package]
name = "analysis-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
algorithms = { path = "../../algorithms", features = ["cuda"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "analysis-engine"
path = "src/main.rs"
