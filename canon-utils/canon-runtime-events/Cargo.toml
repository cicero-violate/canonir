[package]
name = "canon-runtime-events"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
name = "canon_event"

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
canon-semantic-state = { path = "../canon-semantic-state" }
canon_types = { path = "../canon-types" }
canon_invariant = { package = "canon-invariant", path = "../canon-invariant" }
canon-proc-macros = { path = "../canon-proc-macros" }
crc32fast = "1"
fs2 = "0.4"
uuid = { workspace = true }

[dev-dependencies]
canon_storage_eventlog = { package = "canon-storage-eventlog", path = "../canon-storage-eventlog" }
[[bin]]
name = "emit_capability_event"
path = "src/bin/emit_capability_event.rs"
test = false
