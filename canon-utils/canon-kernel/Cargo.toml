[package]
name = "canon-kernel"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "canon-kernel"
path = "src/bin/event_runtime.rs"

[[bin]]
name = "canon-supervisor"
path = "src/bin/supervisor.rs"

[dependencies]
anyhow = { workspace = true }
canon_event = { package = "canon-event", path = "../canon-event" }
canon_event_store = { package = "canon-event-store", path = "../canon-event-store" }
canon_capability_engine = { package = "canon-capability-engine", path = "../canon-capability-engine" }
canon_planner = { package = "canon-planner", path = "../canon-planner" }
canon_editor = { package = "canon-editor", path = "../canon-editor" }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
signal-hook = { workspace = true }
