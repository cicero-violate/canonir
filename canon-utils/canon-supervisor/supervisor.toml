[watcher]
debounce_ms = 300
watch_dirs = ["canon-utils", "canon-agent-prompts"]

[[process]]
name = "canon-event-runtime"
bin  = "target/debug/event_runtime"
args = ["--tlog", "/workspace/ai_sandbox/canon/state/kernel_logs/kernel.tlog.d"]
restart = "kill"
crate_name = "canon-event-runtime"
depends_on = ["canon-event", "canon-analysis", "canon-graph", "canon_query"]
[process.env]
CANON_LLM_BRIDGE_ADDR = "127.0.0.1:9100"
CANON_REPORTS_TLOG = "/workspace/ai_sandbox/canon/state/kernel_logs/kernel.tlog.d"
CANON_REPORTS_OUT  = "/workspace/ai_sandbox/canon/state/reports_out"
CANON_EVENT_RUNTIME_LOG = "/workspace/ai_sandbox/canon/state/event_runtime.log"
CANON_REPORTS_VERIFY_DETERMINISM = "1"
CANON_REPORTS_VERIFY_LAYOUT = "1"
CANON_EVENT_RUNTIME_START_AT_TAIL = "1"
