name: canon

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tlog-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Verify TLOG Equivalence (stress)
        run: |
          cargo run --bin verify_tlog_equivalence -- \
            --json /tmp/kernel.tlog \
            --binary /tmp/kernel.tlog.d \
            --stress
      - name: Verify Reports Layout (tests)
        run: |
          cargo test -p canon-analysis --tests
