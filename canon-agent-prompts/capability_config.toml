[system]
exit_check_command = "cd /workspace/ai_sandbox/canon && cargo run -p orchestration -- --all 2>&1"
max_message_output_lines = 2000
goal_file = "/workspace/ai_sandbox/canon/canon-agent-prompts/AGENT_GOAL.md"
max_iterations = 50
llm_retry_count = 3
llm_retry_delay_secs = 5
response_timeout_secs = 90
max_concurrency = 4
max_nodes = 64
max_expand_iters = 6
context_radius = 2
max_depth = 6
prune_unlinked = true
planner_max_new_nodes = 32
planner_max_new_edges = 64
planner_refine_on_cache = true  #if false we skip planner and just execute
planner_plateau_window = 10
planner_plateau_threshold = 0.01
planner_plateau_expand_factor = 2
auto_prune = true
prune_threshold = 0.2
prune_min_age = 5
recovery_retry_rate_threshold = 0.3
recovery_failed_fraction_threshold = 0.3
template_reuse_threshold = 0.15
template_top_k = 5
repair_radius = 1
max_repairs_per_node = 3
failure_constraint_threshold = 2
max_constraints = 16
cost_latency_weight = 0.001
cost_failure_weight = 1.0
cost_decay_rate = 0.2

[llm]
tab_cooldown_ms = 4000

[llm.endpoints.planner]
id = "planner_chatgpt_group"
url = "https://chatgpt.com/gg/6992c359272881a19d30c226925f575d"
role_markdown = "GENERIC_AGENT_ROLE.md"
role = "planner"
stateful = true
max_tabs = 1

[llm.endpoints.exec_chatgpt_a]
id = "exec_chatgpt_a"
url = "https://chatgpt.com/gg/69a5aa249554819e9ac25e2df27102f1"
role_markdown = "GENERIC_AGENT_ROLE.md"
stateful = true
max_tabs = 4

[llm.endpoints.exec_chatgpt_b]
id = "exec_chatgpt_b"
url = "https://chatgpt.com/gg/699c50e06bc881a3aa5ac1866bf15679"
role_markdown = "GENERIC_AGENT_ROLE.md"
stateful = true
max_tabs = 4

[llm.endpoints.exec_chatgpt_c]
id = "exec_chatgpt_c"
url = "https://chatgpt.com/gg/69a32d7d1a008199948ad06498df2f4f"
role_markdown = "GENERIC_AGENT_ROLE.md"
stateful = true
max_tabs = 4

[llm.endpoints.exec_chatgpt_d]
id = "exec_chatgpt_d"
url = "https://chatgpt.com/gg/699d3878fbd0819a9d73741b03e8128e"
role_markdown = "GENERIC_AGENT_ROLE.md"
stateful = true
max_tabs = 4

[llm.roles.decompose.weights]
exec_chatgpt_a = 100
exec_chatgpt_b = 100
exec_chatgpt_c = 100
exec_chatgpt_d = 100

[llm.roles.decompose]
burst = 4

[llm.roles.planner.weights]
planner_chatgpt_group = 100

[llm.roles.planner]
burst = 4

[llm.roles.exec.weights]
exec_chatgpt_a = 100
exec_chatgpt_b = 100
exec_chatgpt_c = 100
exec_chatgpt_d = 100

[llm.roles.exec]
burst = 4
