# file:/workspace/ai_sandbox/canon/canon-agent-prompts/capability_config.toml

[system]
exit_check_command = "cd /workspace/ai_sandbox/canon && cargo run -p orchestration -- --all 2>&1 && python3 -c \"\nimport json, sys\ndata = json.load(open('orchestration_report.json'))\nfails = [f for f in data['fixtures'] if f['suppressed_count'] > 0 or not f['build_success']]\nif fails:\n    for f in fails: print(f\\\"FAIL {f['fixture']}: suppressed={f['suppressed_count']} build_ok={f['build_success']}\\\")\n    sys.exit(1)\nprint('ALL FIXTURES CLEAN')\n\""
max_message_output_lines = 2000
goal_file = "/workspace/ai_sandbox/canon/canon-agent-prompts/AGENT_GOAL.md"
max_iterations = 200
llm_retry_count = 3
llm_retry_delay_secs = 5
response_timeout_secs = 90
max_concurrency = 4
max_nodes = 64
max_expand_iters = 6
context_radius = 2
max_depth = 6
prune_unlinked = true
planner_max_new_nodes = 32
planner_max_new_edges = 64
planner_refine_on_cache = true  #if false we skip planner and just execute
planner_plateau_window = 10
planner_plateau_threshold = 0.01
planner_plateau_expand_factor = 2
auto_prune = true
prune_threshold = 0.2
prune_min_age = 5
recovery_retry_rate_threshold = 0.3
recovery_failed_fraction_threshold = 0.3
template_reuse_threshold = 0.15
template_top_k = 5
repair_radius = 1
max_repairs_per_node = 3
max_node_retries = 3
failure_constraint_threshold = 2
max_constraints = 16
cost_latency_weight = 0.001
cost_failure_weight = 1.0
cost_decay_rate = 0.2
mutation_rate = 0.25
mutation_budget = 2
mutation_candidates = 2
template_population_size = 5
template_failure_hard_ban = 6
enable_resume = false
snapshot_interval_iters = 1
snapshot_file = "/workspace/ai_sandbox/canon/agent_logs/state_snapshot.json"
goal_similarity_weight = 0.6
structural_similarity_weight = 0.4
embedding_model = "hash"
embedding_dim = 64
goal_drift_threshold = 0.6
goal_refocus_strength = 0.5
goal_refocus_rewrite_strength = 0.3
reports_disable = true
reports_skip_snapshot = true

[llm]
tab_cooldown_ms = 4000

