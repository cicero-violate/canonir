# InvariantPipeline prompt templates
# All {{PLACEHOLDER}} tokens are substituted at runtime by invariant.rs

[invariant]

# Sent on tick 0 — full bootstrap context
bootstrap_template_path = "INVARIANT_BOOTSTRAP.md"

# Sent on tick > 0 — lightweight delta context
delta_template_path = "INVARIANT_DELTA.md"

# Appended to the active template when a previous patch failed.
retry_addendum = """
---
## PREVIOUS PATCH FAILED
Error:
```
{{RETRY_ERROR}}
```
Emit a corrected JSON block addressing the error above.
Only the delta is needed — do not repeat the full surface or MIR context.
"""

# Paths to auxiliary context files (relative to canon-agent-tools/)
agent_goal_path      = "AGENT_GOAL.md"
patch_format_path    = "gpt_5_2_prompt_apply_patch.md"
shell_format_path    = "gpt_5_2_prompt_shell.md"

# MIR source files to include in bootstrap (relative to capture_dir)
mir_sources = [
    "src/capture/helpers.rs",
    "src/capture/mir/lower.rs",
    "src/capture/mir/terminator.rs",
    "src/emit/body.rs",
]
