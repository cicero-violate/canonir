[build]
# rustc-wrapper = "/workspace/ai_sandbox/canon/canon-rustc/target/debug/canon-rustc"
# rustflags = ["-Awarnings"]
rustflags = [
"-Dwarnings",
"-Dunused",
"-Dunused-attributes",
"-Dunused-imports",
"-Dunused-variables",
# "-Fdead-code",
"-Dclippy::allow_attributes",
"-Dclippy::allow_attributes_without_reason"
]

[target.'cfg(all())']
rustflags = [
  "-Dwarnings",
  # "-Fdead-code",
  "-Dclippy::allow_attributes",
  "-Dclippy::allow_attributes_without_reason"
]

[env]
RUST_BACKTRACE = "full"
CANON_TLOG_DUAL_WRITE = "0"

CANON_REPORTS_TLOG="/workspace/ai_sandbox/canon/state/event_log/event.tlog.d"
CANON_REPORTS_OUT="/workspace/ai_sandbox/canon/state/reports_out"
CANON_EVENT_EXECUTION="1"

# CANON_REPORTS_TLOG = "/workspace/ai_sandbox/canon/kernel/logs/graph.tlog"
# CANON_REPORTS_OUT = "/workspace/ai_sandbox/canon/kernel/graph"
# CANON_KERNEL_TYPEGEN= "/path/to/canon_kernel_typegen"

