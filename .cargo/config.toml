[build]
rustc-wrapper = "CANON_TLOG_DUAL_WRITE=1 /workspace/ai_sandbox/canon_kernel/target/debug/canon_kernel"
# rustflags = ["-Awarnings"]
rustflags = [
"-Dwarnings",
"-Dunused",
"-Dunused-attributes",
"-Dunused-imports",
"-Dunused-variables"
]

[target.'cfg(all())']
rustflags = [
  "-Dwarnings",
  "-Dclippy::allow_attributes",
  "-Dclippy::allow_attributes_without_reason"
]

[env]
RUST_BACKTRACE = "full"

# CANON_REPORTS_TLOG = "/workspace/ai_sandbox/canon/kernel/logs/graph.tlog"
# CANON_REPORTS_OUT = "/workspace/ai_sandbox/canon/kernel/graph"
# CANON_KERNEL_TYPEGEN= "/path/to/canon_kernel_typegen"

