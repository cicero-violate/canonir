[watcher]
debounce_ms = 300
watch_dirs = ["canon-utils", "canon-agent-prompts"]

[[process]]
name = "canon-runtime"
bin  = "target/debug/canon-runtime"
args = ["--tlog", "/workspace/ai_sandbox/state/event_log.tlog.d"]
restart = "kill"
crate_name = "canon-runtime"
# depends_on = ["canon-event", "canon-planner"]
[process.env]
CANON_REPORTS_TLOG = "/workspace/ai_sandbox/state/event_log.tlog.d"
CANON_REPORTS_OUT  = "/workspace/ai_sandbox/canon/state/reports_out"
CANON_EVENT_RUNTIME_LOG = "/workspace/ai_sandbox/canon/state/event_runtime.log"
CANON_REPORTS_VERIFY_DETERMINISM = "1"
CANON_REPORTS_VERIFY_LAYOUT = "1"
