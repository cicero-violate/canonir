[watcher]
debounce_ms = 300
watch_dirs = ["canon-utils", "canon-agent-v2", "canon-agent-prompts"]

[[process]]
name = "canon-agent-v2"
bin  = "target/debug/canon-agent-v2"
args = ["run-capability", "/workspace/ai_sandbox/canon"]
restart = "drain"
drain_timeout_ms = 10000

[[process]]
name = "canon-event-runtime"
bin  = "target/debug/event_runtime"
args = ["--tlog", "/workspace/ai_sandbox/canon/state/kernel_logs/kernel.tlog.d"]
restart = "kill"
