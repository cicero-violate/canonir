[package]
name = "canon-agent-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

schemars.workspace = true
thiserror.workspace = true
once_cell.workspace = true
regex.workspace = true
async-trait.workspace = true
anyhow.workspace = true
canon_telemetry = { path = "../canon_telemetry" }
algorithms = { path = "../algorithms" }
rand.workspace = true
rayon.workspace = true
canon_tlog_writer = { package = "canon-tlog-writer", path = "../canon-utils/tlog-writer" }
canon_capability = { package = "canon-capability", path = "../canon-utils/capability" }
canon_types = { package = "canon_types", path = "../canon-utils/canon-types" }

[features]
default = ["cuda"]
cuda = ["algorithms/cuda"]
