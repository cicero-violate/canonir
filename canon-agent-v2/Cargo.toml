[package]
name = "canon-agent-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"

schemars = "0.8"
thiserror = "1"
once_cell = "1"
regex = "1"
async-trait = "0.1"
anyhow = "1"
canon_telemetry = { path = "../canon_telemetry" }
algorithms = { path = "../algorithms" }
rand = "0.8"
rayon = "1.10"

[features]
default = ["cuda"]
cuda = ["algorithms/cuda"]
